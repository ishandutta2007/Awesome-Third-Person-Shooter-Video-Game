<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#24243e" />
      <stop offset="100%" stop-color="#302b63" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="15" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <path d="M200,0 L200,300 M400,0 L400,300 M600,0 L600,300 M800,0 L800,300 M1000,0 L1000,300" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Dynamic Animated Background Elements (Behind Foreground Text) -->
  <g fill="none" stroke-width="2">
    <!-- Animated Target reticle/crosshair circle -->
    <circle cx="1020" cy="150" r="80" stroke="#00c6ff" stroke-opacity="0.3" stroke-dasharray="10 5">
      <animateTransform attributeName="transform" type="rotate" from="0 1020 150" to="360 1020 150" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="150" r="50" stroke="#ff416c" stroke-opacity="0.4" stroke-dasharray="5 5">
      <animateTransform attributeName="transform" type="rotate" from="360 1020 150" to="0 1020 150" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="150" r="8" fill="#ff416c" opacity="0.8">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Radar Sweep Effect -->
    <line x1="1020" y1="150" x2="1100" y2="150" stroke="#00c6ff" stroke-opacity="0.6" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 1020 150" to="360 1020 150" dur="4s" repeatCount="indefinite" />
    </line>

    <!-- Floating HUD Elements on background -->
    <rect x="80" y="40" width="120" height="30" rx="6" fill="#00c6ff" fill-opacity="0.1" stroke="#00c6ff" stroke-opacity="0.3"/>
    <text x="90" y="60" fill="#00c6ff" font-family="Segoe UI, sans-serif" font-size="12" opacity="0.7">STATUS: ONLINE</text>

    <!-- Pulsing waveform lines -->
    <path d="M 80,240 Q 130,220 180,240 T 280,240 T 380,240" stroke="#00c6ff" stroke-opacity="0.3" stroke-width="2" fill="none">
      <animate attributeName="d" values="M 80,240 Q 130,220 180,240 T 280,240 T 380,240; M 80,240 Q 130,260 180,240 T 280,240 T 380,240; M 80,240 Q 130,220 180,240 T 280,240 T 380,240" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Badge -->
    <rect x="80" y="85" width="230" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="195" y="104" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="80" y="160" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="1" filter="url(#glow)">
      Awesome Third-Person Shooter
    </text>
    
    <!-- Subtitle -->
    <text x="80" y="200" fill="url(#textGrad)" font-size="22" font-weight="600" letter-spacing="0.5">
      Top Commercial Games, Open-Source Engines &amp; TPS Frameworks
    </text>

    <!-- Decorative Line -->
    <line x1="80" y1="225" x2="650" y2="225" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
